name: "🐛 Bug Report"
description: "Report an error, glitch, or unexpected behavior in GSFHub"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue!
        > 💡 **Tip (v1.1.0+):** You can type `/gsf bug` in-game or click **"Report Bug / Suggestion"** in the Settings tab to generate and copy a pre-formatted diagnostic block containing your version, locale, and error log automatically.

  - type: input
    id: version
    attributes:
      label: "GSFHub Version"
      description: "What version of GSFHub are you running? (e.g. v1.0.0, v1.1.0)"
      placeholder: "e.g. v1.1.0"
    validations:
      required: true

  - type: dropdown
    id: locale
    attributes:
      label: "Game Client Language / Locale"
      description: "Which language client are you using?"
      options:
        - "English (enUS / enGB)"
        - "German (deDE)"
        - "French (frFR)"
        - "Spanish (esES / esMX)"
        - "Russian (ruRU)"
        - "Chinese / Korean / Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what happened."
      placeholder: "Briefly describe what went wrong..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce / What Were You Doing?"
      description: "Describe what actions led to the bug (or paste the steps/context from '/gsf bug')."
      placeholder: "Explain what you were doing when the issue occurred..."
    validations:
      required: true

  - type: textarea
    id: diagnostic_data
    attributes:
      label: "Diagnostic Data / Lua Error (from '/gsf bug' or BugSack)"
      description: "Paste the diagnostic block generated by '/gsf bug' or any Lua error message here."
      render: text
