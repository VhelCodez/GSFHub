name: "🐛 Bug Report"
description: "Report an error, glitch, or unexpected behavior in GSFHub"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the details below to help us reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: "GSFHub Version"
      description: "What version of GSFHub are you running? (e.g. v1.0.0, v1.1.0)"
      placeholder: "e.g. v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: locale
    attributes:
      label: "Game Client Language / Locale"
      description: "Which language client are you using?"
      options:
        - "English (enUS / enGB)"
        - "German (deDE)"
        - "French (frFR)"
        - "Spanish (esES / esMX)"
        - "Russian (ruRU)"
        - "Chinese / Korean / Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what happened."
      placeholder: "When I opened the professions window and clicked sync..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce this bug?"
      placeholder: |
        1. Open GSFHub with '/gsf'
        2. Click on tab '...'
        3. Click button '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: lua_error
    attributes:
      label: "Lua Error Message / Stack Trace (if any)"
      description: "If an error popup or BugSack/Swatter message appeared, paste it here."
      render: text
