name: Package and Release WoW Addon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Addon Archive
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME="GSFHub-${TAG_NAME}.zip"
          mkdir -p package/GSFHub
          
          # Copy addon files to package directory
          cp -r GSFHub.toc Libs Locales Core Comm Modules UI README.md CHANGELOG.md LICENSE package/GSFHub/
          
          # Create zip
          cd package
          zip -r "../${ARCHIVE_NAME}" GSFHub
          cd ..
          
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists. Recreating release..."
            gh release delete "${{ github.ref_name }}" --yes
          fi
          gh release create "${{ github.ref_name }}" "${ARCHIVE_NAME}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
