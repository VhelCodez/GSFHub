name: Check Blizzard Client Updates

on:
  schedule:
    # Runs daily at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Live Blizzard Builds
        run: |
          chmod +x .github/scripts/check_version.sh
          .github/scripts/check_version.sh
